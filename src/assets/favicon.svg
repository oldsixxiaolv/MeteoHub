<?xml version="1.0" encoding="UTF-8"?>
<!--
  MeteoHub · favicon
  流场蓝主环 + 赭石橙等值线弧 + 一对节点
  32x32 viewBox；浏览器缩放兼容到 16x16
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>MeteoHub</title>
  <!-- 主环 -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#3a86ff" stroke-width="2" />
  <!-- 等值线 1（赭石橙） -->
  <ellipse cx="16" cy="16" rx="11" ry="5" fill="none"
           stroke="#ff7e33" stroke-width="1.5" stroke-dasharray="2 2"
           transform="rotate(-15 16 16)" />
  <!-- 等值线 2（淡流场蓝） -->
  <ellipse cx="16" cy="16" rx="12" ry="6" fill="none"
           stroke="#3a86ff" stroke-width="1" stroke-opacity=".55"
           transform="rotate(20 16 16)" />
  <!-- 节点 -->
  <circle cx="11" cy="12" r="2" fill="#3a86ff" />
  <circle cx="22" cy="20" r="2" fill="#ff7e33" />
</svg>