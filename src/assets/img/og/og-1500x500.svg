<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="MeteoHub — Yihang Lv, Atmospheric Sciences. 以大气之名，写下可被验证的东西。">
  <title>MeteoHub — Yihang Lv · Atmospheric Sciences</title>

  <!-- ============================================================
       MeteoHub · og:image (1500×500, wide header)
       Brand: 流场蓝 × 暖橙赭石 · editorial modern · paper-textured
       ============================================================ -->

  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.27
                             0 0 0 0 0.22
                             0 0 0 0 0.16
                             0 0 0 0.045 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>

    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f2e6"/>
      <stop offset="100%" stop-color="#efe7d4"/>
    </linearGradient>

    <linearGradient id="accentStream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c2691f" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#c2691f" stop-opacity="0.9"/>
      <stop offset="80%"  stop-color="#d97706" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base paper -->
  <rect width="1500" height="500" fill="url(#paperGrad)"/>
  <rect width="1500" height="500" fill="#8a6e44" filter="url(#paper)" opacity="0.6"/>

  <!-- Editorial bleed frame -->
  <rect x="40" y="40" width="1420" height="420" fill="none" stroke="#0b3a5b" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ============================================================
       Streamline art: spans the full width as the hero element
       (sits behind the text for layered editorial composition)
       ============================================================ -->
  <g stroke="#0b3a5b" fill="none" stroke-linecap="round">
    <path d="M0,160  C200,110  400,220  600,170 S1000,110 1200,170 S1500,150 1500,170" stroke-opacity="0.16" stroke-width="1.2"/>
    <path d="M0,220  C200,170  400,280  600,230 S1000,170 1200,230 S1500,210 1500,230" stroke-opacity="0.20" stroke-width="1.3"/>
    <path d="M0,290  C200,240  400,350  600,300 S1000,240 1200,300 S1500,280 1500,300" stroke-opacity="0.24" stroke-width="1.4"/>
    <path d="M0,360  C200,310  400,420  600,370 S1000,310 1200,370 S1500,350 1500,370" stroke-opacity="0.18" stroke-width="1.2"/>
    <path d="M0,420  C200,370  400,480  600,430 S1000,370 1200,430 S1500,410 1500,430" stroke-opacity="0.14" stroke-width="1"/>
  </g>

  <!-- Accent streamline: horizontal warm orange ribbon across the entire banner -->
  <path d="M0,330 C200,280 400,390 600,340 S1000,280 1200,340 S1500,320 1500,340"
        fill="none" stroke="url(#accentStream)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Direction particles -->
  <g fill="#c2691f">
    <circle cx="220"  cy="310" r="2.5"/>
    <circle cx="540"  cy="362" r="2.5"/>
    <circle cx="880"  cy="320" r="2.5"/>
    <circle cx="1200" cy="350" r="2.5"/>
  </g>

  <!-- ============================================================
       Foreground: editorial type block (left-anchored)
       ============================================================ -->
  <!-- Top wordmark -->
  <g font-family="'Source Serif 4', 'Noto Serif SC', 'Times New Roman', Georgia, serif" fill="#0b3a5b">
    <text x="80" y="92" font-size="20" font-weight="600" letter-spacing="6">METEOHUB</text>
    <line x1="80" y1="106" x2="160" y2="106" stroke="#c2691f" stroke-width="2"/>
  </g>

  <!-- Identity -->
  <g font-family="'Source Serif 4', 'Noto Serif SC', 'Times New Roman', Georgia, serif" fill="#0b1720">
    <text x="80" y="180" font-size="60" font-weight="600" letter-spacing="-1">Yihang Lv</text>
    <text x="80" y="216" font-size="22" fill="#0b3a5b" fill-opacity="0.75" letter-spacing="0.5">Atmospheric Sciences · PhD Candidate · IAP-CAS</text>
  </g>

  <!-- Tagline -->
  <g font-family="'Source Serif 4', 'Noto Serif SC', 'Times New Roman', Georgia, serif">
    <line x1="80" y1="258" x2="180" y2="258" stroke="#c2691f" stroke-width="2"/>
    <text x="80" y="290" font-size="20" fill="#0b3a5b" letter-spacing="2">以大气之名，写下可被验证的东西。</text>
    <text x="80" y="314" font-size="12" fill="#0b3a5b" fill-opacity="0.55" letter-spacing="1.5" font-style="italic">East Asian monsoon variability · data assimilation · ML bias correction</text>
  </g>

  <!-- Right-side annotation: affiliation -->
  <g font-family="'Source Serif 4', 'Noto Serif SC', 'Times New Roman', Georgia, serif" fill="#0b3a5b" text-anchor="end">
    <text x="1420" y="92" font-size="13" fill-opacity="0.7" letter-spacing="1.5">IAP-CAS · Institute of Atmospheric Physics</text>
    <text x="1420" y="112" font-size="11" fill-opacity="0.5" letter-spacing="2">BEIJING · 中科院大气物理研究所</text>
  </g>

  <!-- Bottom footer -->
  <line x1="80" y1="420" x2="1420" y2="420" stroke="#0b3a5b" stroke-opacity="0.10" stroke-width="1"/>
  <g font-family="'Source Serif 4', 'Noto Serif SC', 'Times New Roman', Georgia, serif" fill="#0b3a5b">
    <text x="80" y="442" font-size="12" fill-opacity="0.6" letter-spacing="1.5">φ 39.9° N · λ 116.4° E · 850 hPa streamline</text>
    <text x="1420" y="442" font-size="12" fill-opacity="0.6" letter-spacing="1.5" text-anchor="end">meteohub.org · @lyuyihang</text>
  </g>
</svg>
