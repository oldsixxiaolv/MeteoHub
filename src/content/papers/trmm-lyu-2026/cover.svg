<?xml version="1.0" encoding="UTF-8"?>
<!--
  MeteoHub · TRMM Legacy 论文封面
  1500×600 学术封面：流场蓝主调 + 暖橙赭石强调
  - 主元素：非洲轮廓（简化） + 闪电符号 + 三阶段示意（compact / mature / extensive）
  - 关键词：「TRMM Legacy · Tropical Africa · Lightning × Convection Stage」
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600"
     role="img" aria-label="TRMM Legacy · Tropical Africa · Lightning × Convection Stage">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stage-grad" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ff7e33" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#66a4ff" stop-opacity="0.40" />
    </linearGradient>
  </defs>

  <!-- 底色：浅 cream（neutral-50） -->
  <rect width="1500" height="600" fill="#FBF8F3" />

  <!-- 背景径向渐变（流场蓝辉光） -->
  <rect width="1500" height="600" fill="url(#bg-glow)" />

  <!-- 左侧：非洲简化轮廓（20°W–50°E, 20°S–20°N） -->
  <g transform="translate(140, 80)" stroke="#3a86ff" stroke-width="2" fill="#3a86ff" fill-opacity="0.08" stroke-linejoin="round">
    <!-- 简化非洲轮廓（看 google 地图大致形：北宽南窄 + 东角） -->
    <path d="M 10 90
             Q 30 60 60 50
             Q 90 35 130 40
             Q 170 45 200 60
             L 220 80
             Q 240 100 250 140
             Q 260 180 240 220
             Q 220 260 200 290
             Q 180 310 150 320
             Q 120 325 95 305
             Q 70 280 50 250
             Q 30 220 15 180
             Q 5 140 10 90 Z" />
    <!-- 马达加斯加小岛 -->
    <ellipse cx="280" cy="320" rx="8" ry="22" fill="#3a86ff" fill-opacity="0.12" stroke="#3a86ff" stroke-width="1.5" />
  </g>

  <!-- 闪电符号（沿非洲中部垂直方向，5 条） -->
  <g stroke="#ff7e33" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 180 170 L 175 200 L 185 200 L 178 230" />
    <path d="M 210 200 L 205 230 L 215 230 L 208 260" />
    <path d="M 160 220 L 155 250 L 165 250 L 158 280" />
    <path d="M 230 250 L 225 280 L 235 280 L 228 310" />
    <path d="M 195 280 L 190 310 L 200 310 L 193 340" />
  </g>

  <!-- 右侧：三阶段示意（compact → mature → extensive） -->
  <g transform="translate(580, 220)">
    <!-- 背景 -->
    <text x="0" y="-30" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500" fill="#3a86ff" letter-spacing="0.06em" text-transform="uppercase">Three Stages</text>

    <!-- Pre-Mature：compact + 闪电密集 -->
    <g transform="translate(0, 0)">
      <circle cx="40" cy="50" r="36" fill="url(#stage-grad)" fill-opacity="0.25" stroke="#3a86ff" stroke-width="1.5" />
      <text x="40" y="115" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#575049" font-weight="500">Pre-Mature</text>
      <text x="40" y="132" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#7d776d">compact · 高密度</text>
    </g>

    <!-- Mature：中央，赭石橙突出 -->
    <g transform="translate(160, 0)">
      <circle cx="40" cy="50" r="46" fill="url(#stage-grad)" fill-opacity="0.45" stroke="#ff7e33" stroke-width="2" />
      <text x="40" y="115" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#575049" font-weight="600">Mature</text>
      <text x="40" y="132" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#7d776d">最强对流 · 峰值闪电</text>
    </g>

    <!-- Post-Mature：extensive -->
    <g transform="translate(320, 0)">
      <circle cx="40" cy="50" r="56" fill="url(#stage-grad)" fill-opacity="0.30" stroke="#66a4ff" stroke-width="1.5" />
      <text x="40" y="115" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#575049" font-weight="500">Post-Mature</text>
      <text x="40" y="132" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#7d776d">扩散 · 低密度</text>
    </g>

    <!-- 连接箭头 -->
    <path d="M 88 50 L 154 50" stroke="#3a86ff" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" opacity="0.55" />
    <path d="M 254 50 L 320 50" stroke="#3a86ff" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none" opacity="0.55" />
    <defs>
      <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <polygon points="0 0, 6 3, 0 6" fill="#3a86ff" />
      </marker>
    </defs>
  </g>

  <!-- 右下角统计数字 -->
  <g transform="translate(1150, 460)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="14" fill="#575049">16 yr TRMM</text>
    <text x="0" y="20" font-family="'Inter', sans-serif" font-size="14" fill="#575049">tropical Africa</text>
    <text x="0" y="40" font-family="'Inter', sans-serif" font-size="14" fill="#575049">stage-dependent</text>
  </g>

  <!-- 顶部小字：品牌色 -->
  <text x="140" y="50"
        font-family="'Noto Serif SC', 'Source Serif 4', serif"
        font-size="18" font-weight="500" fill="#3a86ff" letter-spacing="0.04em">
    MeteoHub · 论文精读
  </text>

  <!-- 左侧主标题 -->
  <text x="140" y="500"
        font-family="'Noto Serif SC', 'Source Serif 4', serif"
        font-size="32" font-weight="700" fill="#221f1b" letter-spacing="-0.01em">
    Stage-Dependent Lightning
  </text>
  <text x="140" y="540"
        font-family="'Noto Serif SC', 'Source Serif 4', serif"
        font-size="20" font-weight="500" fill="#575049" letter-spacing="-0.005em">
    × Convective Structure · Tropical Africa
  </text>
  <text x="140" y="572"
        font-family="'Inter', sans-serif" font-size="14" font-style="italic" fill="#7d776d">
    Wu &amp; Lyu et al. · JGR: Atmospheres · 2026
  </text>
</svg>