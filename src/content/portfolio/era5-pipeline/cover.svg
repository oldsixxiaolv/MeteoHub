<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1f2d"/>
      <stop offset="1" stop-color="#1f3b4d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#355c75" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#9bd1ff">
    <text x="40" y="50">era5-pipeline</text>
    <text x="40" y="76" fill="#cfd8dc">CDS API  →  QC  →  衍生变量  →  Zarr</text>
    <text x="40" y="120">[Stage 1] raw NetCDF</text>
    <text x="40" y="160">[Stage 2] qc  (range / outlier / fill)</text>
    <text x="40" y="200">[Stage 3] derive (thta / vor / div / flux)</text>
    <text x="40" y="240">[Stage 4] rechunk + zarr v2</text>
    <text x="40" y="320" fill="#ffd166" font-size="14">status: shipped · 2024</text>
  </g>
</svg>
